# Model Configuration
model:
  # EfficientNetB0 backbone
  efficientnetb0:
    pretrained: true
    num_classes: 1
    dropout_rate: 0.3
    freeze_base: true
    unfreeze_from_layer: -30  # Unfreeze last 30 layers for fine-tuning

  # SVM parameters
  svm:
    kernel: rbf
    C: 1.0
    gamma: scale
    probability: true

  # Random Forest parameters
  random_forest:
    n_estimators: 100
    max_depth: 20
    min_samples_split: 2
    min_samples_leaf: 1

  # KNN parameters
  knn:
    n_neighbors: 5
    weights: distance
    algorithm: auto

  # Ensemble parameters
  ensemble:
    voting: soft
    weights: [0.4, 0.2, 0.2, 0.2]  # [EfficientNetB0, SVM, RF, KNN]
    calibration_method: sigmoid

# Training parameters
training:
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 32
  epochs: 50
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 5
  min_lr: 1.0e-7

# Image preprocessing
preprocessing:
  image_size: [224, 224]
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

# GradCAM configuration
gradcam:
  target_layer: "backbone.conv_head"  # timm efficientnet_b0's last conv layer before pooling
  colormap: jet
  alpha: 0.4